[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Netlify publishes the repo root, so hide repo files that aren't part of the site
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Assets/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.specify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# Edge function source; the functions themselves run on /puzzle/*, /p/*, /c/* and /og/*
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Don't redirect .well-known files
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

# Extensionless URLs hard-coded in the iOS app
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

# Puzzle page redirects
[[redirects]]
  from = "/puzzle/*"
  to = "/puzzle.html?id=:splat"
  status = 200
  force = true

# Shared player-made puzzles carry the whole puzzle in the path; the page decodes it
[[redirects]]
  from = "/c/*"
  to = "/shared.html"
  status = 200
  force = true

# Unknown paths fall through to Netlify's 404.html
